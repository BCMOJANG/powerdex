      <nav class="desktop-nav" aria-label="主导航">
        <a href="index.html" class="nav-link"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></svg><span>型号库</span></a>

        </div>
        <p class="page-intro-lede">选择 2–3 款并排查看规格、接口和曲线读数。</p>
      </div>

      <div class="compare-shell">
        <div class="compare-slots" id="compareSlots">
          <button class="compare-slot is-empty" type="button" data-compare-add><span class="compare-slot-plus" aria-hidden="true">+</span><span><strong>型号 A</strong><small>从型号库添加</small></span></button>
          <button class="compare-slot is-empty" type="button" data-compare-add><span class="compare-slot-plus" aria-hidden="true">+</span><span><strong>型号 B</strong><small>从型号库添加</small></span></button>

        </div>

        <div class="compare-table-wrap">
          <div class="compare-empty">
            <p>选两款型号，容量、能量、接口和曲线读数会在这里并排展开。</p>
            <span class="compare-empty-hint">↑ 从上方空位或型号库加入对比</span>
          </div>
        </div>

        <div class="compare-foot">
          <p><span class="status-dot" aria-hidden="true"></span><span id="compareHint">对比席空闲中。先从型号库选择 2–3 款。</span></p>
          <button class="text-button" type="button" id="compareClear" disabled>清空对比</button>
        </div>
      </div>
    </section>
  </main>

  <div class="compare-dock" id="compareDock" hidden>

    <div class="compare-dock-chips" id="compareChips"></div>
    <div class="compare-dock-actions">
      <button class="text-button" type="button" id="compareDockClear">清空</button>
      <a class="button button-primary button-small" href="compare.html" id="compareDockGo">开始对比</a>
    </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
